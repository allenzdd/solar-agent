<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FusionSolar 仿真模拟 · 入口</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:radial-gradient(900px 500px at 20% -10%, #16203a 0%, #0a0c11 60%);
    color:#e8e8ed; font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    display:flex; align-items:center; justify-content:center; min-height:100vh;
  }
  .box { text-align:center; }
  h1 { font-size:22px; margin-bottom:8px; }
  p  { font-size:12.5px; color:#7c8291; margin-bottom:26px; }
  .lnks { display:flex; gap:14px; justify-content:center; flex-wrap:wrap; }
  a.card {
    display:block; width:250px; padding:20px 18px; border-radius:16px; text-decoration:none; color:#fff;
    background:rgba(255,255,255,.045); border:1px solid rgba(255,255,255,.1); transition:.15s; text-align:left;
  }
  a.card:hover { background:rgba(58,122,254,.12); border-color:rgba(58,122,254,.5); transform:translateY(-2px); }
  a.card b { display:block; font-size:15.5px; margin-bottom:6px; }
  a.card span { font-size:12px; color:#8b91a0; line-height:1.6; display:block; }
  a.card .ic { font-size:22px; margin-bottom:10px; display:block; }
  .tip { margin-top:24px; font-size:11.5px; color:#5f6675; line-height:1.8; }
</style>
</head>
<body>
  <div class="box">
    <h1>FusionSolar 光储仿真系统</h1>
    <p>管理端与 APP 使用端独立访问，通过服务端共享电站数据</p>
    <div class="lnks">
      <a class="card" href="/manage/">
        <span class="ic">⚡</span>
        <b>光储电站仿真台</b>
        <span>普通网页界面：创建 / 管理模拟光储电站，调节云量、负载与储能策略，实时运行并向 APP 推送数据。</span>
      </a>
      <a class="card" href="/app/">
        <span class="ic">📱</span>
        <b>FusionSolar APP 监控</b>
        <span>手机 APP 仿真：电站列表、统计、告警、设备与小源智能问答，实时接收仿真台数据。</span>
      </a>
    </div>
    <div class="tip">管理端登录后运行仿真，APP 可在其他设备查看；<br>关闭管理页后仿真暂停，最新配置和快照仍保存在服务端。</div>
  </div>
</body>
</html>
