<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小源 · 对话入口预览</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf2f8;font:15px "Microsoft YaHei",sans-serif;color:#152945}main{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;padding:20px}article{width:350px}h2{font-size:17px;margin:0 0 10px}.phone{border:1px solid #d0dbea;border-radius:22px;background:#f7f9fd;height:358px;position:relative;overflow:hidden;box-shadow:0 4px 14px #11284a0c}.status{font-size:12px;font-weight:bold;padding:13px 18px 5px}.top{display:flex;align-items:center;gap:4px;padding:0 10px;height:46px}.top b{flex:1}.back,.more{font-size:19px;color:#405571;padding:0 7px}.top button,.drawer button{cursor:pointer;font:inherit}.top button{display:flex;align-items:center;gap:5px;border:1px solid #cfdcee;background:#fff;border-radius:18px;color:#264a77;padding:6px 9px;font-size:13px}.top svg{width:17px;height:17px}.body{padding:10px 14px}.question{background:#285ee9;color:white;border-radius:14px 14px 3px 14px;padding:9px 13px;width:max-content;margin:0 0 18px auto}.answer{line-height:1.7}.answer small{color:#687993}.report{border:1px solid #d8e1ed;background:#fff;border-radius:12px;padding:12px;margin-top:8px}.report strong{font-size:19px;color:#244e9b}.composer{position:absolute;bottom:12px;left:12px;right:12px;background:white;border:1px solid #d8e1ed;border-radius:18px;padding:10px 14px;color:#77869d}.mask{position:absolute;inset:0;background:#14253c50}.drawer{position:absolute;inset:0 0 0 20%;background:#f5f8fc;border-radius:17px 0 0 17px;padding:20px 14px}.drawer h3{margin:0 0 12px}.drawer input,.drawer button{width:100%;padding:10px;text-align:left;border:0;border-radius:8px;background:transparent}.drawer input{background:white;border:1px solid #d9e1ec}.drawer .new{border-bottom:1px solid #dae3ed;border-radius:0;color:#2554a4}.drawer small{display:block;color:#77869d;margin:13px 10px 0}.hint{font-size:13px;line-height:1.6;color:#516581;margin:9px 2px}svg{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
</style><main></main><script>
const icons={panel:'<rect x="3" y="4" width="18" height="16" rx="3"/><path d="M14 5v14m3-10h1m-1 4h1"/>',history:'<path d="M3 10a9 9 0 1 1 2 8M3 5v5h5m4-3v5l3 2"/>',new:'<path d="M14 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8M10 14l1-4 7-7 3 3-7 7z"/>'};
const svg=k=>'<svg viewBox="0 0 24 24" aria-hidden="true">'+icons[k]+'</svg>';
for(const dual of [false,true]){
 const article=document.createElement('article');document.querySelector('main').append(article);
 article.innerHTML='<h2>'+(dual?'B　双入口':'A　单入口 · 推荐')+'</h2><div class="phone"><div class="status">12:20</div><div class="top"><span class="back">‹</span><b>华为小源</b><span class="more">···</span>'+(dual?'<button class="start">'+svg('new')+'新建</button>':'')+'<button class="open">'+svg(dual?'history':'panel')+(dual?'历史':'对话')+'</button></div><div class="body"></div><div class="composer">＋　问问小源…</div><div class="mask" hidden><div class="drawer"><h3>'+(dual?'历史对话':'对话')+'</h3><input placeholder="搜索对话"><button class="new">＋　新建对话</button><small>今天</small><button class="entry">查看电站健康度</button><button class="entry">上海青浦厂房定容报告</button></div></div></div><div class="hint">'+(dual?'点「新建」直接开始；点「历史」查找已有对话。':'点「对话」打开右侧抽屉，可新建、搜索或接着聊。')+'</div>';
 const q=k=>article.querySelector(k),mask=q('.mask'),body=q('.body');function show(t){body.replaceChildren();const b=document.createElement('div');b.className='question';b.textContent=t;body.append(b);const a=document.createElement('div');a.className='answer';a.innerHTML='<small>回答完成（用时2秒）</small><div class="report">'+(t.includes('健康')?'电站健康度<br><strong>96</strong> / 100':'光储项目定容报告<br><strong>1.3</strong> MWp')+'</div>';body.append(a);mask.hidden=true;}show('查看电站健康度');
 q('.open').onclick=()=>{mask.hidden=false};mask.onclick=e=>{if(e.target===mask)mask.hidden=true};function fresh(){mask.hidden=true;body.innerHTML='<h3>你好，我是小源</h3>今天想了解哪座电站？'}q('.new').onclick=fresh;if(dual)q('.start').onclick=fresh;const entries=[...article.querySelectorAll('.entry')];entries.forEach(b=>b.onclick=()=>show(b.textContent));q('input').oninput=e=>entries.forEach(b=>b.hidden=!b.textContent.includes(e.target.value));
}
</script></html>
